<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insulin Drip Protocol Trainer</title>
    <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>

    <div id="main-menu">
        <h2>Neuro ICU Insulin Drip Trainer</h2>
        <p>Select a difficulty level to begin:</p>
        <button class="menu-btn btn-easy" onclick="startQuiz('easy')">Easy (Basic Starts)</button><br>
        <button class="menu-btn btn-medium" onclick="startQuiz('medium')">Medium (Shifts)</button><br>
        <button class="menu-btn btn-hard" onclick="startQuiz('hard')">Hard (Hypoglycemia)</button><br>
        <button class="menu-btn btn-impossible" onclick="startQuiz('impossible')">IMPOSSIBLE (100 Hours)</button>
    </div>

    <div id="app-interface">
        <h2 id="difficulty-title">Non-Surgical Critical Care Insulin Drip</h2>
        
        <div class="scenario-box">
            <h3 id="question-text">Loading scenario...</h3>
            <p id="progress-tracker" style="font-size: 12px; color: #555; margin-top: 5px; font-weight: bold;"></p>
        </div>

        <div class="table-container" id="grid-container">
            <table id="drip-table">
                <thead>
                    <tr id="table-headers">
                        <th>DIRECTIONS</th>
                        <th>Blood Glucose ROW (mg/dl)</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div id="feedback-box" class="feedback"></div>
        <button id="next-btn" onclick="nextQuestion()">Next Hour</button>
        <button id="menu-btn" onclick="returnToMenu()">Return to Main Menu</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
